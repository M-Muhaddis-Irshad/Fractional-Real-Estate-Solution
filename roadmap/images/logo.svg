<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Flux logo">
  <defs>
    <linearGradient id="fluxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a7e"/>
      <stop offset="1" stop-color="#0a1f3c"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fluxBg)"/>
  <!-- skyline / growth bars -->
  <rect x="13" y="30" width="9" height="20" rx="2.5" fill="#e8c25b"/>
  <rect x="27" y="20" width="9" height="30" rx="2.5" fill="#f5d678"/>
  <rect x="41" y="24" width="9" height="26" rx="2.5" fill="#e8c25b"/>
  <!-- rising step line -->
  <polyline points="14,44 23,36 31,40 40,30 49,33" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
